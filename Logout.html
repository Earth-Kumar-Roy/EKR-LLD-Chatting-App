<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Logout | EKR LLD Chatting App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-emerald-100 via-slate-50 to-blue-50">

  <div class="max-w-md w-full text-center space-y-8">
    
    <div class="space-y-2">
      <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter drop-shadow-sm">
        EKR LLD Chatting App
      </h1>
      <div class="h-1 w-16 bg-emerald-500 mx-auto rounded-full"></div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl shadow-slate-200/60 p-8 md:p-10 space-y-8 border border-white animate-in fade-in zoom-in duration-300">
      
      <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto text-red-500 shadow-inner">
        <i class="fas fa-sign-out-alt text-3xl"></i>
      </div>

      <div class="space-y-2">
        <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Confirm Logout</h2>
        <p class="text-slate-500 text-sm font-medium leading-relaxed px-4">
          Are you sure you want to end your secure session? All local chat contexts will be cleared for security.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-4">
        <button onclick="cancelLogout()" 
          class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-2xl transition-all active:scale-95 uppercase tracking-widest text-[11px]">
          Cancel
        </button>

        <button onclick="confirmLogout()" 
          class="flex-1 py-4 bg-red-600 hover:bg-red-700 text-white font-black rounded-2xl shadow-lg shadow-red-200 transition-all active:scale-95 uppercase tracking-widest text-[11px]">
          Logout
        </button>
      </div>
    </div>

    <footer class="text-center">
      <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">
        © 2026 EKR | Secure Terminal
      </p>
    </footer>

  </div>

  <script>
    /**
     * Navigation via Google Apps Script server-side logic
     */
    function loadPage(pageName) {
      google.script.run.withSuccessHandler(function (html) {
        document.open();
        document.write(html);
        document.close();
      }).loadPage(pageName);
    }

    /**
     * Returns the user to the active chats dashboard
     */
    function cancelLogout() {
      loadPage('Chats');
    }

    /**
     * Purges session data and returns user to login portal
     */
    function confirmLogout() {
      // Step 1: Remove core application keys
      localStorage.removeItem('LOGGEDINUSER');
      localStorage.removeItem('CHAT_WITH');
      localStorage.removeItem('CHAT_ID');

      // Step 2: Comprehensive purge of all remaining keys
      Object.keys(localStorage).forEach(key => {
        localStorage.removeItem(key);
      });

      // Step 3: Redirect to authentication page
      loadPage('Login');
    }
  </script>
</body>
</html>
